<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self'; img-src 'self' data:">
  <title>Samayam – School Timetable &amp; Substitution</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

      <div class="brand">
        <span class="logo" aria-hidden="true">⏰</span>

          <div class="brand-name">Samayam</div>
          <div class="brand-sub" id="brandSchool"></div>

  <div id="toast" class="toast" aria-hidden="true"></div>
  <dialog id="dlg"></dialog>

  <script src="i18n.js"></script>
  <script src="presets.js"></script>
